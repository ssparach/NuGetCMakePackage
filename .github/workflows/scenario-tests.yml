name: Scenario Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  scenario-basic:
    name: Basic Scenario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: NuNuGet.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: NuNuGet
          - os: macos-latest
            rid: osx-arm64
            exe: NuNuGet

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: src/NuNuGet/global.json

      # Build NuNuGet from source and put it on PATH so CMake's find_program uses it
      # instead of downloading a released package.
      - name: Build NuNuGet (${{ matrix.rid }})
        shell: pwsh
        working-directory: src/NuNuGet
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "__nunuget/${{ matrix.rid }}"
          dotnet publish ./NuNuGet/NuNuGet.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            /p:PublishProfile=SingleFileSelfContained `
            --output $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $out "${{ matrix.exe }}"
          if (-not (Test-Path -LiteralPath $exe)) { throw "NuNuGet not found at $exe" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $out

      - name: Verify CMake
        shell: pwsh
        run: |
          Get-Command cmake
          cmake --version

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run scenario tests
        shell: pwsh
        env:
          NUGET_TOOLS_PATH: ${{ github.workspace }}/__tools
        run: |
          $result = Invoke-Pester scenarios/basic/Basic.Tests.ps1 -Output Detailed -PassThru
          exit $result.FailedCount
